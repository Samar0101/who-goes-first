<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Stand‑up Randomiser</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 40px;
    }

    .header {
      max-width: 1000px;
      margin: 0 auto 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
    }

    p {
      margin: 6px 0 0;
      color: #475569;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }

    button:hover {
      background: #1d4ed8;
    }

    .grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .tile {
      position: relative;
      height: 160px;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .tile.shuffle {
      transform: translateY(-10px) rotate(0.6deg);
      box-shadow: 0 16px 30px rgba(0,0,0,0.3);
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      padding: 0 12px;
      line-height: 1.2;
    }

    .order {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.92);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2>🎤 Daily Stand‑up Order</h2>
      <p>Click to randomise the speaking order</p>
    </div>
    <button onclick="randomise()">🔀 Randomise</button>
  </div>

  <div id="grid" class="grid"></div>

  <script>
    const names = [
      "Stanley",
      "Dayyaan",
      "Yoly",
      "Caitlyn",
      "Samar",
      "Brooke"
    ];

    // Vibrant, darker but friendly colours
    const colors = [
      "#38BDF8", // Blue
      "#22C55E", // Green
      "#F97316", // Orange
      "#A855F7", // Purple
      "#EC4899", // Pink
      "#EF4444", // Red
      "#FACC15", // Yellow
      "#06B6D4"  // Cyan
    ];

    const grid = document.getElementById("grid");

    function shuffle(array) {
      return [...array]
        .map(v => ({ v, r: Math.random() }))
        .sort((a, b) => a.r - b.r)
        .map(o => o.v);
    }

    function randomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function render(list) {
      grid.innerHTML = "";

      list.forEach((name, index) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.style.background = randomColor();

        tile.innerHTML = `
          <div class="name">${name}</div>
          <div class="order">#${index + 1}</div>
        `;

        grid.appendChild(tile);
      });
    }

    function randomise() {
      document
        .querySelectorAll(".tile")
        .forEach(tile => tile.classList.add("shuffle"));

      setTimeout(() => {
        render(shuffle(names));
      }, 300);
    }

    // Initial load
    render(shuffle(names));
  </script>

</body>
</html>
